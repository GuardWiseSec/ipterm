name = "ipterm"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# Serve only on your own domain (ipterm.net, set up in the dashboard). The *.workers.dev address and
# preview URLs would be a second copy of the site where the cache doesn't work, so every lookup there
# would spend the IPinfo and proxycheck.io allowances. Custom domains are not affected by these.
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first for pages and the API (homepage, /<ip>, /AS<number>, /api/*, guides, sitemap).
# Static files (CSS, JS, fonts, images, map data) skip the Worker: Cloudflare serves them free and
# unlimited, and public/_headers gives them their security headers. Add any new static file here.
run_worker_first = [
  "/*",
  "!/app.css",
  "!/app.js",
  "!/land.js",
  "!/cidr.js",
  "!/ports.js",
  "!/resolvers.js",
  "!/changes.js",
  "!/leakgrade.js",
  "!/prefs.js",
  "!/sponsors.json",
  "!/site.webmanifest",
  "!/favicon.ico",
  "!/favicon.svg",
  "!/apple-touch-icon.png",
  "!/icon-192.png",
  "!/icon-512.png",
  "!/og.png",
  "!/og-leak-a.png",
  "!/og-leak-b.png",
  "!/og-leak-c.png",
  "!/og-leak-d.png",
  "!/og-leak-f.png",
  "!/openapi.json",
  "!/llms.txt",
  "!/opensearch.xml",
  "!/fonts/*",
]

[vars]
# Set to "true" to let other websites call your API from the browser (CORS).
# curl and server-side scripts work either way.
PUBLIC_API = "false"

# Running your own copy? Set this to "true": every page is marked noindex (so the copy doesn't compete
# with ipterm.net in search), the sitemap is empty, sponsors.json is ignored (no sponsored line), reference pages
# show no "Something wrong here?" line, and the footer, `about` and /help say the site is a copy of ipterm. See
# "Self-hosting" in docs/handbook.md.
SELF_HOSTED = "false"

# Where the source code lives. The footer, `about` and /help link the deployed build's commit here
# (<SOURCE_URL>/commit/<sha>), so anyone can read the code that is running. Leave it empty for no link.
# A GitHub repository here also gets reference pages a line that opens its correction form
# (.github/ISSUE_TEMPLATE/correction.yml); empty, or anywhere else, means no line.
SOURCE_URL = "https://github.com/GuardWiseSec/ipterm"

# Which IPinfo plan your IPINFO_TOKEN is on: "lite" (free: country and network only) or
# "core" (paid: adds city, region, coordinates, time zone and connection type).
# If Core's monthly quota runs out, lookups fall back to Lite automatically.
IPINFO_PLAN = "core"

# Core only: at most this many fresh Core lookups per day (UTC), so one scraper can't use up the
# month. 4500 a day is about 140,000 a month, inside Core's 150,000. Past it, lookups use Lite.
# LAUNCH WEEK (Show HN, from 2026-10-20): raised from 4500 / 375 / 30 to take a front-page day; 144.7K of
# the 150K were left until the plan renews on 2026-11-12. Put back 4500 / 375 / 30 (and drop
# PROXYCHECK_VISITOR_HOURLY) about a week after the post.
IPINFO_DAILY_BUDGET = "15000"

# Core only: at most this many fresh Core lookups per hour, so a burst only uses up that hour and
# city-level results return the next hour. 375 is about twice an even share of the daily budget,
# leaving room for busy hours. Leave it out to use that default; "0" turns hourly pacing off.
IPINFO_HOURLY_BUDGET = "2500"

# Core only: at most this many fresh Core lookups per visitor (IP, or IPv6 /64) per hour, so one
# visitor can't use up the hourly budget for everyone. Past it, that visitor gets Lite. "0" = no cap.
IPINFO_VISITOR_HOURLY = "10"

# proxycheck.io (optional second opinion on VPN / proxy / Tor; turns on once the PROXYCHECK_KEY
# secret is set): at most this many queries a day (UTC). The free plan allows 1,000; 900 leaves a
# margin. Hourly pacing defaults to twice an even share (75) and each visitor to 10 an hour; set
# PROXYCHECK_HOURLY_BUDGET / PROXYCHECK_VISITOR_HOURLY to change them. "0" turns proxycheck.io off.
PROXYCHECK_DAILY_BUDGET = "900"
# Launch week: 3 a visitor an hour (default 10), so the free plan's 900 a day reaches more people.
PROXYCHECK_VISITOR_HOURLY = "3"

# DNS leak test (leaktest's DNS line): the zone the page's test lookups go to, and the HTTPS API of the
# small server that answers for that zone (dnsleak-server/ in this repo, on a VPS outside Cloudflare).
# It stays off until the DNSLEAK_KEY secret is set as well (npx wrangler secret put DNSLEAK_KEY): until
# then leaktest says DNS leaks weren't tested, and the CSP doesn't allow the zone. Set up the server
# first (dnsleak-server/README.md). Remove either line to turn the test off again.
DNSLEAK_ZONE = "dl.ipterm.net"
DNSLEAK_API = "https://dlapi.ipterm.net"

# The deployed version's id and tag. `npm run deploy` (tools/deploy.mjs) tags each version with the git
# short SHA, and the footer, `about` and /help show it as "the code we deploy". A plain `wrangler deploy`
# has no tag, so they show no SHA.
[version_metadata]
binding = "CF_VERSION_METADATA"

# The daily counter for IPINFO_DAILY_BUDGET and PROXYCHECK_DAILY_BUDGET (a Durable Object; included in the free Workers plan).
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "LookupBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LookupBudget"]

# Known VPN servers, from the server lists the VPN providers publish themselves (src/vpn-lists.js), and Apple's iCloud
# Private Relay list (src/relay-list.js): one Durable Object keeps them, packed into small blobs that lookups search in
# memory. Free for lookups, but the refresh needs Workers Paid (about 0.5 s of CPU to read a changed Apple list; the
# Free plan's 10 ms applies to Durable Objects too); the deployment creates it. On a Free account, delete this binding
# and [triggers] below to switch the lists off (see "Self-hosting" in docs/handbook.md).
[[durable_objects.bindings]]
name = "VPN_SERVERS"
class_name = "VpnServers"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VpnServers"]

# Refreshes those lists every 6 hours (at minute 17, away from the top of the hour): one request to each provider and
# to Apple.
[triggers]
crons = ["17 */6 * * *"]

# Per-visitor limit on lookups: 30 requests per 60 seconds.
# namespace_id is any number you choose that is unique within your Cloudflare account.
[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Per-visitor limit on port checks (`port <n>`, /port/<n> from the command line, /api/port): 10 per
# 60 seconds. Each check makes the Worker open one TCP connection to the visitor's own address.
# namespace_id: unique within your account and different from LOOKUP_LIMITER's (limiters that share one share counters).
[[ratelimits]]
name = "PORT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60
